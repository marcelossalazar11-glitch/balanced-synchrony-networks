[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "balanced-synchrony-networks"
version = "0.1.0"
description = "Computational tools for balanced synchrony partitions in typed networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "networkx>=3.0,<4",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.9", "jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
